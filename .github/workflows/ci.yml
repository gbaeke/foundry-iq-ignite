name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag upstream
      - uses: actions/setup-node@v7
        with:
          node-version: 26  # same major as local dev; 26 is LTS since 2026-10-28
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: uv sync --locked
      - run: scripts/check.sh
