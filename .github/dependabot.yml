# Weekly update PRs, grouped so they arrive as a few PRs instead of dozens; CI (scripts/check.sh) checks each.
# Majors come one by one: read the changelog before merging.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [minor, patch] }
    ignore:
      # TS 7 has no JavaScript compiler API yet and @hey-api/openapi-ts crashes on it; drop this once it works
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
